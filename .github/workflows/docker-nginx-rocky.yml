name: Docker Nginx Rocky Amd64

on:
  workflow_dispatch:
    inputs:
      env_name:
        description: '部署环境'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev
      version:
        description: '版本号'
        required: true
        default: '1.30.1'

jobs:
  build-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
        
      - name: Log in to the Container registry
        uses: docker/login-action@v2.0.0
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Build the Nginx Docker image Amd64
        run: docker build --file rocky/9/nginx/Dockerfile --build-arg BASE_ROCKY_VERSION=${{ vars.BASE_ROCKY_VERSION || '9.8.20260525.0-minimal' }} --build-arg NGINX_VERSION=${{ inputs.version }} --tag ghcr.io/${{ github.actor }}/nginx:${{ inputs.version }}-rocky .

      - name: Push the Nginx Docker image Amd64
        run: docker push ghcr.io/${{ github.actor }}/nginx:${{ inputs.version }}-rocky
