name: Docker Kafka Rocky Arm64

on:
  workflow_dispatch:
    inputs:
      base_rocky_version:
        description: 'Rocky Linux 基础镜像版本(留空则读取仓库变量 BASE_ROCKY_VERSION,默认 9-minimal)'
        required: false
        default: ''
      version:
        description: '版本号'
        required: true
        default: '3.5'

jobs:
  build-kafka:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2.0.0
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Qemu
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build the Docker image
        run: docker buildx build --platform=linux/arm64 --file rocky/9/kafka/3.5/Dockerfile --build-arg BASE_ROCKY_VERSION=${{ inputs.base_rocky_version || vars.BASE_ROCKY_VERSION || '9-minimal' }} --tag ghcr.io/${{ github.actor }}/kafka:${{ inputs.version }}-rocky-arm64 . --load && docker push ghcr.io/${{ github.actor }}/kafka:${{ inputs.version }}-rocky-arm64
