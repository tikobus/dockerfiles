name: Build Rocky9 Caddy Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '2.11.4'
      base_rocky_version:
        description: 'Rocky Linux 基础镜像版本(留空则读取仓库变量 BASE_ROCKY_VERSION,默认 9-minimal)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./rocky/9/caddy
          build-args: |
            BASE_ROCKY_VERSION=${{ inputs.base_rocky_version || vars.BASE_ROCKY_VERSION || '9-minimal' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: tikobus/rocky9-caddy:${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
