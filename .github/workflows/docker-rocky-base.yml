name: Docker Rocky Base Amd64
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Rocky Linux 版本号(留空则读取仓库变量 BASE_ROCKY_VERSION)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v2.0.0
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Docker Rocky Base Amd64 image
        run: |
          BASE_ROCKY_VERSION="${{ inputs.version || vars.BASE_ROCKY_VERSION || '9-minimal' }}"
          docker build . --file rocky/9/base/Dockerfile --build-arg BASE_ROCKY_VERSION=${BASE_ROCKY_VERSION} --tag ghcr.io/tikobus/rockylinux:${BASE_ROCKY_VERSION}
          docker push ghcr.io/tikobus/rockylinux:${BASE_ROCKY_VERSION}
