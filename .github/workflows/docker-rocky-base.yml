name: Docker Rocky Base Amd64
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '9.8.20260525.0-minimal'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v2.0.0
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Docker Rocky Base Amd64 image
        run: docker build . --file rocky/9/base/Dockerfile --build-arg BASE_ROCKY_VERSION=${{ inputs.version }} --tag ghcr.io/tikobus/rockylinux:${{ inputs.version }} && docker push ghcr.io/tikobus/rockylinux:${{ inputs.version }}
