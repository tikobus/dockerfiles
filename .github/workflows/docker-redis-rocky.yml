name: Docker Redis Rocky Amd64

on:
  workflow_dispatch:
    inputs:
      base_rocky_version:
        description: 'Rocky Linux 基础镜像版本(留空则读取仓库变量 BASE_ROCKY_VERSION,默认 9-minimal)'
        required: false
        default: ''
      version:
        description: '版本号'
        required: true
        default: '7.0'

jobs:
  build-redis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
        
      - name: Log in to the Container registry
        uses: docker/login-action@v2.0.0
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Build the Redis Docker image
        run: docker build --file rocky/9/redis/7.0/Dockerfile --build-arg BASE_ROCKY_VERSION=${{ inputs.base_rocky_version || vars.BASE_ROCKY_VERSION || '9-minimal' }} --tag ghcr.io/${{ github.actor }}/redis:${{ inputs.version }}-rocky .
    
      - name: Push the Redis Docker image
        run: docker push ghcr.io/${{ github.actor }}/redis:${{ inputs.version }}-rocky
