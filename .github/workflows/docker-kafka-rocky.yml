name: Docker Kafka Rocky Amd64

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '3.5'

jobs:
  build-kafka:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
        
      - name: Log in to the Container registry
        uses: docker/login-action@v2.0.0
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Build the Docker image
        run: docker build . --file rocky/9/kafka/3.5/Dockerfile --tag ghcr.io/${{ github.actor }}/kafka:${{ inputs.version }}-rocky && docker push ghcr.io/${{ github.actor }}/kafka:${{ inputs.version }}-rocky
