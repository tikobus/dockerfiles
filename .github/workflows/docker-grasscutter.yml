name: Docker Grasscutter

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '4.0'

jobs:
  build-Grasscutter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2.0.0
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Grasscutter Docker image
        run: cd rocky/9/grasscutter/4.0 && docker build . --file Dockerfile --tag ghcr.io/tikobus/grasscutter:${{ inputs.version }} && docker push ghcr.io/tikobus/grasscutter:${{ inputs.version }}
