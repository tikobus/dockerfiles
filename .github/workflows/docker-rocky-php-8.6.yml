name: Docker PHP 8.6 Rocky Amd64

on:
  workflow_dispatch:
    inputs:
      base_rocky_version:
        description: 'Rocky Linux 基础镜像版本(留空则读取仓库变量 BASE_ROCKY_VERSION,默认 9-minimal)'
        required: false
        default: ''
      version:
        description: '版本号'
        required: true
        default: '8.6'

jobs:
  build-php:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2.0.0
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the PHP 8 Docker image
        run: docker build . --file rocky/9/php/8.6/Dockerfile --build-arg BASE_ROCKY_VERSION=${{ inputs.base_rocky_version || vars.BASE_ROCKY_VERSION || '9-minimal' }} --tag ghcr.io/tikobus/php:${{ inputs.version }}-rocky && docker push ghcr.io/tikobus/php:${{ inputs.version }}-rocky

